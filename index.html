on, productio","summaryEs":"Este artículo desarrolla un enfoque microeconómico y ascendente para cuantificar los costes macroeconómicos del cambio climático. Combina los daños climáticos locales estimados empíricamente con un modelo de equilibrio general espacial a escala mundial: el Modelo de Equilibrio General Espacial sobre el Clima y la Adaptación (OECD-CASGEM). El modelo vincula los riesgos climáticos específicos de cada lugar con los resultados de toda la economía a través del comercio, la migración y la producción","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-04T14:00:45.763Z"},{"id":"fatf:4e213e176851","source":"fatf","sourceLabel":"GAFI (FATF)","title":"Investigating Professional Money Laundering, Underground Banking, and the Use of Hawala and Other Similar Service Providers","titleEs":"Investigación sobre el blanqueo de capitales por parte de profesionales, la banca sumergida y el uso del sistema «hawala» y otros proveedores de servicios similares","url":"https://www.fatf-gafi.org/pml-underground-banking-hawala","date":"2026-09-02","summary":"<p>This report highlights the growing role of underground banking, hawala and other similar service providers (HOSSPs) in facilitating illicit finance.</p>","summaryEs":"<p>Este informe destaca el papel cada vez más importante que desempeñan la banca clandestina, el sistema hawala y otros proveedores de servicios similares (HOSSP) a la hora de facilitar las finanzas ilícitas.</p>","themes":["prevencion-de-lavado-de-activos"],"discoveredAt":"2026-09-03T14:00:05.705Z"},{"id":"eu:fdebd03067f1","source":"eu","sourceLabel":"Comisión Europea (UE)","title":"A place to call home: how cohesion policy is responding to Europe’s housing shortage","titleEs":"Un lugar al que llamar hogar: cómo la política de cohesión está abordando la escasez de viviendas en Europa","url":"https://housing.ec.europa.eu/whats-new/news/place-call-home-how-cohesion-policy-responding-europes-housing-shortage-2026-09-02_en","date":"2026-09-02","summary":"Through cohesion policy, the EU is helping national, regional and local authorities expand affordable housing, renovate existing homes and create neighbourhoods fit for a changing climate.","summaryEs":"A través de la política de cohesión, la UE está ayudando a las autoridades nacionales, regionales y locales a ampliar la oferta de viviendas asequibles, renovar las viviendas existentes y crear barrios adaptados a un clima en constante cambio.","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-03T14:00:05.705Z"},{"id":"wbcsd:32c6a193284b","source":"wbcsd","sourceLabel":"WBCSD","title":"P&G: Building a Supply of Low-Carbon Raw Materials to Better Serve Consumers","titleEs":"P&G: Creación de una fuente de materias primas con bajas emisiones de carbono para atender mejor a los consumidores","url":"https://www.wbcsd.org/news/pg-building-a-supply-of-low-carbon-raw-materials-to-better-serve-consumers/","date":"2026-09-01","summary":"To meet Net Zero 2040 goals, P&G needed standardized carbon data from suppliers to identify real reduction opportunities. PACT, a global open standard for product-level (…) The post P&G: Building a Supply of Low-Carbon Raw Materials to Better Serve Consumers first appeared on WBCSD .","summaryEs":"Para cumplir los objetivos de «Net Zero 2040», P&G necesitaba datos estandarizados sobre las emisiones de carbono de sus proveedores con el fin de identificar oportunidades reales de reducción. PACT, un estándar abierto global a nivel de producto (…) El artículo «P&G: Creación de un suministro de materias primas con bajas emisiones de carbono para atender mejor a los consumidores» se publicó por primera vez en WBCSD.","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-02T14:09:55.040Z"},{"id":"oecd:590efcd2c800","source":"oecd","sourceLabel":"OCDE (OECD)","title":"New Data for Africa’s Changing Climate","titleEs":"Nuevos datos sobre el cambio climático en África","url":"https://www.oecd.org/en/publications/new-data-for-africa-s-changing-climate_27d083ca-en","date":"2026-09-01","summary":"The African continent is highly vulnerable to climate-related risks. At the same time, Africa contributes only 4% of global energy-related greenhouse gas emissions. Policymakers need foundational data on key climate indicators to point the way towards a low-carbon, climate-resilient path. Yet these data remain limited for most African countries. This report aims to fill the gap in foundational dat","summaryEs":"El continente africano es muy vulnerable a los riesgos relacionados con el clima. Al mismo tiempo, África solo contribuye con un 4 % de las emisiones mundiales de gases de efecto invernadero relacionadas con la energía. Los responsables políticos necesitan datos básicos sobre indicadores climáticos clave para trazar el camino hacia una economía con bajas emisiones de carbono y resiliente al cambio climático. Sin embargo, estos datos siguen siendo escasos en la mayoría de los países africanos. El presente informe tiene como objetivo subsanar esta carencia de datos básicos.","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-01T14:00:52.385Z"},{"id":"eu:c71c4ec4e252","source":"eu","sourceLabel":"Comisión Europea (UE)","title":"EU countries submit draft plans on restoring nature","titleEs":"Los países de la UE presentan borradores de planes para la restauración de la naturaleza","url":"https://environment.ec.europa.eu/news/eu-countries-submit-draft-plans-restoring-nature-2026-09-01_en","date":"2026-09-01","summary":"The plans contain information on how Member States intend to meet each of the restoration targets up to 2030.","summaryEs":"Los planes contienen información sobre cómo pretenden los Estados miembros cumplir cada uno de los objetivos de restauración hasta 2030.","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-01T14:00:52.385Z"},{"id":"cmf:295bd2cf5adb","source":"cmf","sourceLabel":"CMF (Chile)","title":"CMF sanciona a dos bancos por infracción a la Ley sobre Abandono d lso address economic security and distribute transition costs fairly. This paper reviews national and international studies, presents new results across population groups in OECD countries, and discusses implications for designing and communicating reforms, including accompa","summaryEs":"Los datos internacionales sobre la opinión pública muestran que la transición ecológica no puede avanzar basándose únicamente en motivos medioambientales; también debe abordar la seguridad económica y distribuir los costes de la transición de forma equitativa. Este artículo analiza estudios nacionales e internacionales, presenta nuevos resultados sobre distintos grupos de población en los países de la OCDE y aborda las implicaciones para el diseño y la comunicación de las reformas, incluidas las medidas de acompañamiento","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-01T14:00:52.385Z"},{"id":"fcpa:fe23279b2530","source":"fcpa","sourceLabel":"FCPA (DOJ EE.UU.)","title":"Nigerian National Sentenced for Laundering $3.1M in Scam Proceeds","titleEs":"Condenan a un ciudadano nigeriano por blanquear 3,1 millones de dólares procedentes de una estafa","url":"https://www.justice.gov/opa/pr/nigerian-national-sentenced-laundering-31m-scam-proceeds","date":"2026-08-28","summary":"A Nigerian national was sentenced yesterday to 95 months in prison for his role in a money laundering conspiracy involving millions of dollars tied to various fraud schemes — including business email compromise, romance, and unemployment insurance fraud scams — perpetrated against U.S. citizens.","summaryEs":"Un ciudadano nigeriano fue condenado ayer a 95 meses de prisión por su participación en una trama de blanqueo de capitales que ascendía a millones de dólares y estaba relacionada con diversas estafas —entre ellas, el suplantación de identidad en el correo electrónico empresarial, las estafas sentimentales y el fraude al seguro de desempleo— perpetradas contra ciudadanos estadounidenses.","themes":["pre ,"themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-08-21T05:26:42.378Z"},{"id":"cmf:67ad4068f586","source":"cmf","sourceLabel":"CMF (Chile)","title":"CMF invita a participar en talleres de trabajo sobre los estándares internacionales de reportes de sostenibilidad NIIF S1 y S2","titleEs":"CMF invita a participar en talleres de trabajo sobre los estándares internacionales de reportes de sostenibilidad NIIF S1 y S2","url":"https://www.cmfchile.cl/portal/prensa/625/w4-article-110958.html","date":"2026-06-04","summary":"Con el objetivo de acompañar a las entidades supervisadas en la implementación de la Norma de Carácter General N°519 se realizará la primera sesión de los talleres el próximo 16 de junio y contará con la participación de un experto de la IFRS Foundation.","summaryEs":"Con el objetivo de acompañar a las entidades supervisadas en la implementación de la Norma de Carácter General N°519 se realizará la primera sesión de los talleres el próximo 16 de junio y contará con la participación de un experto de la IFRS Foundation.","themes":["sostenibilidad-y-esg","compliance-y-regulacion"],"discoveredAt":"2026-08-27T04:05:52.473Z"},{"id":"amla:d610ea75e5ed","source":"amla","sourceLabel":"AMLA (UE)","title":"Consultation on the draft RTS on Customer Due Diligence","titleEs":"Consulta sobre el proyecto de normas técnicas de regulación (RTS) relativas a la diligencia debida con respecto al cliente","url":"https://www.amla.europa.eu/policy/public-consultations/consultation-draft-rts-customer-due-diligence_en","date":"2026-05-08","summary":null,"summaryEs":null,"themes":["prevencion-de-lavado-de-activos"],"discoveredAt":"2026-10-12T19:17:17.013Z"},{"id":"fatf:5fb212501814","source":"fatf","sourceLabel":"GAFI (FATF)","title":"Targeted report on Stablecoins and Unhosted Wallets - Peer-to-Peer Transactions","url":"https://www.fatf-gafi.org/en/publications/Virtualassets/targeted-report-stablecoins-unhosted-wallets.html","date":"2026-03-02","summary":"<p>A new report from <script>
(function () {
  var DATA = (window.__RADAR__ || { generatedAt: null, publications: [] });
  var pubs = DATA.publications || [];

  var SOURCE_COLOR = {
    oecd: "#00838a", fatf: "#b0403a", eu: "#274b9e",
    wbcsd: "#3f8f4e", wef: "#5b3fa0",
    uaf: "#c2571a", cmf: "#1f6f8b", fcpa: "#7a2e2e", amla: "#b8336a"
  };
  var SOURCE_LABEL = {
    oecd: "OCDE", fatf: "GAFI/FATF", eu: "Comisión Europea",
    wbcsd: "WBCSD", wef: "WEF",
    uaf: "UAF", cmf: "CMF", fcpa: "FCPA / DOJ", amla: "AMLA"
  };
  // Los nombres y colores de las categorías vienen de categorias.txt vía el
  // payload, de modo que agregar una categoría allí la hace aparecer aquí sin
  // tocar esta plantilla. El respaldo cubre páginas generadas antes del cambio.
  var THEME_LABEL = {}, THEME_COLOR = {};
  (DATA.categories || []).forEach(function (c) {
    THEME_LABEL[c.id] = c.label;
    THEME_COLOR[c.id] = c.color;
  });
  if (!Object.keys(THEME_LABEL).length) {
    THEME_LABEL = {
      "sostenibilidad": "Sostenibilidad y ESG",
      "compliance": "Compliance y regulación",
      "lavado-de-activos": "Prevención de lavado de activos",
      "antisoborno": "Antisoborno y delitos económicos"
    };
    THEME_COLOR = {
      "sostenibilidad": "#3f8f4e", "compliance": "#1f5f8b",
      "lavado-de-activos": "#b0403a", "antisoborno": "#8a5a1f"
    };
  }

  var state = { q: "", sources: new Set(), themes: new Set(), sortDesc: true };

  function esc(s){ return (s||"").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fmtDate(d){ if(!d) return "s/f"; var p=d.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }

  function renderStats(){
    var bySource = {};
    pubs.forEach(function(p){ bySource[p.source]=(bySource[p.source]||0)+1; });
    var el = document.getElementById("stats");
    var cards = ['<div class="stat"><div class="n">'+pubs.length+'</div><div class="l">Publicaciones totales</div></div>'];
    Object.keys(SOURCE_LABEL).forEach(function(s){
      cards.push('<div class="stat"><div class="n">'+(bySource[s]||0)+'</div><div class="l">'+SOURCE_LABEL[s]+'</div></div>');
    });
    el.innerHTML = cards.join("");
  }

  function renderFilters(){
    var sc = document.getElementById("sourceFilters");
    Object.keys(SOURCE_LABEL).forEach(function(s){
      var c = document.createElement("span"); c.className="chip"; c.dataset.source=s;
      c.innerHTML='<span class="dot" style="background:'+SOURCE_COLOR[s]+'"></span>'+SOURCE_LABEL[s];
      c.onclick=function(){ toggle(state.sources, s, c); render(); };
      sc.appendChild(c);
    });
    var tc = document.getElementById("themeFilters");
    Object.keys(THEME_LABEL).forEach(function(t){
      var c = document.createElement("span"); c.className="chip"; c.dataset.theme=t;
      c.innerHTML='<span class="dot" style="background:'+THEME_COLOR[t]+'"></span>'+THEME_LABEL[t];
      c.onclick=function(){ toggle(state.themes, t, c); render(); };
      tc.appendChild(c);
    });
  }
  function toggle(set, val, el){ if(set.has(val)){set.delete(val); el.classList.remove("on");} else {set.add(val); el.classList.add("on");} }

  function filtered(){
    var q = state.q.toLowerCase();
    var out = pubs.filter(function(p){
      if(state.sources.size && !state.sources.has(p.source)) return false;
      if(state.themes.size && !p.themes.some(function(t){return state.themes.has(t);})) return false;
      if(q){ var hay=((p.titleEs||p.title||"")+" "+(p.summaryEs||p.summary||"")+" "+(p.title||"")).toLowerCase(); if(hay.indexOf(q)===-1) return false; }
      return true;
    });
    out.sort(function(a,b){
      var da=a.date||"", db=b.date||"";
      if(da===db) return 0;
      if(!da) return 1; if(!db) return -1;
      return state.sortDesc ? (da<db?1:-1) : (da<db?-1:1);
    });
    return out;
  }

  function render(){
    var items = filtered();
    document.getElementById("count").textContent = items.length + (items.length===1?" resultado":" resultados");
    var list = document.getElementById("list");
    if(!items.length){ list.innerHTML='<div class="empty">Sin resultados con los filtros actuales.</div>'; return; }
    list.innerHTML = items.map(function(p){
      var badge='<span class="badge" style="background:'+(SOURCE_COLOR[p.source]||"#666")+'">'+esc(SOURCE_LABEL[p.source]||p.source)+'</span>';
      var tags=(p.themes||[]).map(function(t){ return '<span class="tag">'+esc(THEME_LABEL[t]||t)+'</span>'; }).join("");
      var title = p.titleEs || p.title;
      var orig = (p.titleEs && p.title && p.titleEs !== p.title) ? '<div class="orig">'+esc(p.title)+'</div>' : '';
      var summaryText = p.summaryEs || p.summary;
      var summary = summaryText ? '<p>'+esc(summaryText)+'</p>' : '';
      return '<div class="card"><div class="head">'+badge+'<span class="date">'+fmtDate(p.date)+'</span></div>'+
        '<h3><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(title)+'</a></h3>'+
        orig+summary+'<div class="themes">'+tags+'</div></div>';
    }).join("");
  }

  document.getElementById("search").addEventListener("input", function(e){ state.q=e.target.value; render(); });
  document.getElementById("sortBtn").addEventListener("click", function(e){
    state.sortDesc=!state.sortDesc;
    e.target.textContent = "Ordenar: " + (state.sortDesc? "más recientes primero":"más antiguos primero");
    render();
  });

  // Canal de sugerencias. Deliberadamente NO usa un enlace mailto:, que depende
  // de que cada computador tenga configurado un cliente de correo — si no lo
  // tiene, el clic no hace nada y la persona queda sin saber por que. En vez de
  // eso mostramos el texto listo para copiar, con un atajo a Gmail.
  // Para cambiar el destinatario, edita las dos partes de CONTACTO.
  // Va partido a proposito: esta pagina es publica y los rastreadores de spam
  // recogen direcciones escritas completas en el HTML.
  var CONTACTO = ["contacto", "eticolabora.com"].join("@");
  var ASUNTO = "Radar - sugerencia de cambio";

  function textoSugerencia() {
    var ctx = [];
    if (state.q) ctx.push('Busqueda: "' + state.q + '"');
    if (state.sources.size) {
      ctx.push("Organismos: " + Array.from(state.sources).map(function (s) {
        return SOURCE_LABEL[s] || s; }).join(", "));
    }
    if (state.themes.size) {
      ctx.push("Temas: " + Array.from(state.themes).map(function (t) {
        return THEME_LABEL[t] || t; }).join(", "));
    }
    return "Hola,\n\nQuisiera sugerir un cambio en el Radar:\n\n" +
      "[ Escribe aqui que categoria, palabra clave u organismo falta o sobra ]\n\n" +
      "----------------------------------------\n" +
      "Contexto de lo que estaba viendo:\n" +
      (ctx.length ? ctx.join("\n") : "Sin filtros aplicados") + "\n" +
      "Publicaciones a la vista: " + filtered().length + "\n" +
      "Fecha: " + new Date().toLocaleString("es-CL") + "\n";
  }

  document.getElementById("suggestBtn").addEventListener("click", function () {
    var bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML =
      '<div class="modal">' +
        "<h2>Sugerir un cambio</h2>" +
        '<p class="hint">Escribe tu sugerencia abajo y envíala a <strong>' + esc(CONTACTO) +
        "</strong>. Puedes copiar el texto o abrirlo directamente en Gmail.</p>" +
        '<textarea id="sugTexto"></textarea>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-primary" id="sugCopiar">Copiar texto</button>' +
          '<button class="btn" id="sugGmail">Abrir en Gmail</button>' +
          '<button class="btn" id="sugCerrar">Cerrar</button>' +
          '<span class="ok-msg" id="sugOk" hidden>¡Copiado!</span>' +
        "</div>" +
      "</div>";
    document.body.appendChild(bg);

    var ta = bg.querySelector("#sugTexto");
    ta.value = textoSugerencia();
    ta.focus();

    function cerrar() { if (bg.parentNode) document.body.removeChild(bg); }
    bg.addEventListener("click", function (e) { if (e.target === bg) cerrar(); });
    bg.querySelector("#sugCerrar").addEventListener("click", cerrar);

    bg.querySelector("#sugCopiar").addEventListener("click", function () {
      var ok = bg.querySelector("#sugOk");
      function exito() { ok.hidden = false; setTimeout(function () { ok.hidden = true; }, 2500); }
      // El API moderno necesita contexto seguro; execCommand cubre el resto.
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(exito, function () { ta.select(); document.execCommand("copy"); exito(); });
      } else {
        ta.select(); document.execCommand("copy"); exito();
      }
    });

    bg.querySelector("#sugGmail").addEventListener("click", function () {
      window.open("https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(CONTACTO) +
        "&su=" + encodeURIComponent(ASUNTO) + "&body=" + encodeURIComponent(ta.value), "_blank");
    });
  });

  var upd = DATA.generatedAt ? new Date(DATA.generatedAt) : null;
  document.getElementById("updated").innerHTML = upd
    ? "Actualizado<br>"+upd.toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"short"})
    : "";
  document.getElementById("footer").textContent = "Radar interno Eticolabora · " + pubs.length + " publicaciones monitoreadas de " + Object.keys(SOURCE_LABEL).length + " organismos";

  // Si la traduccion dejo de correr (p. ej. la sesion de Claude expiro), que se
  // note aqui en vez de quedar enterrado en un log que nadie abre.
  var sinTraducir = pubs.filter(function (p) { return !p.titleEs; }).length;
  if (sinTraducir > 0) {
    var av = document.getElementById("aviso");
    av.innerHTML = "⚠️ <strong>" + sinTraducir + "</strong> " +
      (sinTraducir === 1 ? "publicación aparece" : "publicaciones aparecen") +
      " en su idioma original. La traducción automática no está corriendo — " +
      "suele ser que la sesión de Claude expiró y hay que volver a iniciarla.";
    av.hidden = false;
  }

  renderStats(); renderFilters(); render();
})();
</script>
</body>
</html>
