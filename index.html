<style>

  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .ok-msg { color: #3f8f4e; font-size: 13px; font-weight: 600; }

alidad de la provincia de Zelanda, en los Países Bajos.","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-07T14:09:35.821Z"},{"id":"fcpa:38e0cf1988cd","source":"fcpa","sourceLabel":"FCPA (DOJ EE.UU.)","title":"Mexican National Pleads Guilty to Laundering More than $4M in Drug Trafficking Proceeds","titleEs":"Ciudadano mexicano se declara culpable de blanquear más de USD 4 millones procedentes del narcotráfico","url":"https://www.justice.gov/opa/pr/mexican-national-pleads-guilty-laundering-more-19m-drug-trafficking-proceeds","date":"2026-09-04","summary":"A Mexican national, Carlos Erick Vazquez Gonzalez, 48, pleaded guilty today for his role in the laundering of approximately $4 million in drug trafficking proceeds in the United States and the return of those proceeds via cryptocurrency to Mexico as part of a money laundering conspiracy.","summaryEs":"Un ciudadano mexicano, Carlos Erick Vazquez Gonzalez, de 48 años, se declaró culpable hoy por su participación en el blanqueo de aproximadamente USD 4 millones procedentes del narcotráfico en Estados Unidos y en la devolución de dichos fondos a México mediante criptomonedas, como parte de una conspiración de lavado de dinero.","themes":["prevencion-de-lavado-de-activos"],"discoveredAt":"2026-09-04T21:49:40.275Z"},{"id":"oecd:910ac70e431d","source":"oecd","sourceLabel":"OCDE (OECD)","title":"The climate and adaptation spatial general equilibrium model (OECD‑CASGEM)","titleEs":"El modelo espacial de equilibrio general sobre clima y adaptación (OCDE‑CASGEM)","url":"https://www.oecd.org/en/publications/the-climate-and-adaptation-spatial-general-equilibrium-model-oecd-casgem_bd3ad48b-en","date":"2026-09-03","summary":"This paper develops a micro-based, bottom-up approach to quantify the macroeconomic costs of climate change. It combines empirically estimated local climate damages with a global spatial general equilibrium model: the Climate and Adaptation Spatial General Equilibrium Model (OECD-CASGEM). The model links location-specific climate hazards to economy-wide outcomes through trade, migration, productio","summaryEs":"Este documento desarrolla un enfoque micro y de abajo hacia arriba para cuantificar los costos macroeconómicos del cambio climático. Combina daños climáticos locales estimados empíricamente con un modelo global espacial de equilibrio general: el Modelo Espacial de Equilibrio General sobre Clima y Adaptación (OCDE-CASGEM). El modelo vincula los peligros climáticos específicos de cada ubicación con los resultados en toda la economía a través del comercio, la migración, la producción","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-04T14:00:45.763Z"},{"id":"fatf:4e213e176851","source":"fatf","sourceLabel":"GAFI (FATF)","title":"Investigating Professional Money Laundering, Underground Banking, and the Use of Hawala and Other Similar Service Providers","titleEs":"Investigación del lavado de dinero profesional, la banca clandestina y el uso de hawala y otros proveedores de servicios similares","url":"https://www.fatf-gafi.org/pml-underground-banking-hawala","date":"2026-09-02","summary":"<p>This report highlights the growing role of underground banking, hawala and other similar service providers (HOSSPs) in facilitating illicit finance.</p>","summaryEs":"<p>Este informe destaca el creciente papel de la banca clandestina, el hawala y otros proveedores de servicios similares (HOSSPs) en la facilitación de finanzas ilícitas.</p>","themes":["prevencion-de-lavado-de-activos"],"discoveredAt":"2026-09-03T14:00:05.705Z"},{"id":"eu:fdebd03067f1","source":"eu","sourceLabel":"Comisión Europea (UE)","title":"A place to call home: how cohesion policy is responding to Europe’s housing shortage","titleEs":"Un lugar al que llamar hogar: cómo la política de cohesión responde a la escasez de vivienda en Europa","url":"https://housing.ec.europa.eu/whats-new/news/place-call-home-how-cohesion-policy-responding-europes-housing-shortage-2026-09-02_en","date":"2026-09-02","summary":"Through cohesion policy, the EU is helping national, regional and local authorities expand affordable housing, renovate existing homes and create neighbourhoods fit for a changing climate.","summaryEs":"A través de la política de cohesión, la UE está ayudando a las autoridades nacionales, regionales y locales a ampliar la vivienda asequible, renovar las viviendas existentes y crear barrios adaptados a un clima cambiante.","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-03T14:00:05.705Z"},{"id":"wbcsd:32c6a193284b","source":"wbcsd","sourceLabel":"WBCSD","title":"P&G: Building a Supply of Low-Carbon Raw Materials to Better Serve Consumers","titleEs":"P&G: construcción de un suministro de materias primas bajas en carbono para servir mejor a los consumidores","url":"https://www.wbcsd.org/news/pg-building-a-supply-of-low-carbon-raw-materials-to-better-serve-consumers/","date":"2026-09-01","summary":"To meet Net Zero 2040 goals, P&G needed standardized carbon data from suppliers to identify real reduction opportunities. PACT, a global open standard for product-level (…) The post P&G: Building a Supply of Low-Carbon Raw Materials to Better Serve Consumers first appeared on WBCSD .","summaryEs":"Para cumplir los objetivos Net Zero 2040, P&G necesitaba datos estandarizados sobre carbono de sus proveedores con el fin de identificar oportunidades reales de reducción. PACT, un estándar global abierto para el nivel de producto (…) La publicación P&G: Building a Supply of Low-Carbon Raw Materials to Better Serve Consumers apareció por primera vez en WBCSD.","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-02T14:09:55.040Z"},{"id":"oecd:590efcd2c800","source":"oecd","sourceLabel":"OCDE (OECD)","title":"New Data for Africa’s Changing Climate","titleEs":"Nuevos datos para el clima cambiante de África","url":"https://www.oecd.org/en/publications/new-data-for-africa-s-changing-climate_27d083ca-en","date":"2026-09-01","summary":"The African continent is highly vulnerable to climate-related risks. At the same time, Africa contributes only 4% of global energy-related greenhouse gas emissions. Policymakers need foundational data on key climate indicators to point the way towards a low-carbon, climate-resilient path. Yet these data remain limited for most African countries. This report aims to fill the gap in foundational dat","summaryEs":"El continente africano es altamente vulnerable a los riesgos relacionados con el clima. Al mismo tiempo, África contribuye solo con el 4% de las emisiones globales de gases de efecto invernadero relacionadas con la energía. Los responsables políticos necesitan datos fundamentales sobre indicadores climáticos clave para señalar el camino hacia una trayectoria baja en carbono y resiliente al clima. Sin embargo, estos datos siguen siendo limitados para la mayoría de los países africanos. Este informe pretende cubrir la brecha en los datos fundamentales.","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-01T14:00:52.385Z"},{"id":"eu:c71c4ec4e252","source":"eu","sourceLabel":"Comisión Europea (UE)","title":"EU countries submit draft plans on restoring nature","titleEs":"Los países de la UE presentan proyectos de planes para la restauración de la naturaleza","url":"https://environment.ec.europa.eu/news/eu-countries-submit-draft-plans-restoring-nature-2026-09-01_en","date":"2026-09-01","summary":"The plans contain information on how Member States intend to meet each of the restoration targets up to 2030.","summaryEs":"Los planes contienen información sobre cómo los Estados miembros pretenden cumplir cada uno de los objetivos de restauración hasta 2030.","themes":["sostenibilidad-y-esg"],"discoveredAt":"2026-09-01T14:00:52.385Z"},{"id":"cmf:295bd2cf5adb","source":"cmf","sourceLabel":"CMF (Chile)","title":"CMF sanciona a dos bancos por infracción a la Ley sobre Abandono de Familia y Pago de Pensiones Alimenticias","titleEs":"CMF sanciona a dos bancos por infracción a la Ley sobre Abandono     var cards = ['<div class="stat"><div class="n">'+pubs.length+'</div><div class="l">Publicaciones totales</div></div>'];
    Object.keys(SOURCE_LABEL).forEach(function(s){
      cards.push('<div class="stat"><div class="n">'+(bySource[s]||0)+'</div><div class="l">'+SOURCE_LABEL[s]+'</div></div>');
    });
    el.innerHTML = cards.join("");
  }

  function renderFilters(){
    var sc = document.getElementById("sourceFilters");
    Object.keys(SOURCE_LABEL).forEach(function(s){
      var c = document.createElement("span"); c.className="chip"; c.dataset.source=s;
      c.innerHTML='<span class="dot" style="background:'+SOURCE_COLOR[s]+'"></span>'+SOURCE_LABEL[s];
      c.onclick=function(){ toggle(state.sources, s, c); render(); };
      sc.appendChild(c);
    });
    var tc = document.getElementById("themeFilters");
    Object.keys(THEME_LABEL).forEach(function(t){
      var c = document.createElement("span"); c.className="chip"; c.dataset.theme=t;
      c.innerHTML='<span class="dot" style="background:'+THEME_COLOR[t]+'"></span>'+THEME_LABEL[t];
      c.onclick=function(){ toggle(state.themes, t, c); render(); };
      tc.appendChild(c);
    });
  }
  function toggle(set, val, el){ if(set.has(val)){set.delete(val); el.classList.remove("on");} else {set.add(val); el.classList.add("on");} }

  function filtered(){
    var q = state.q.toLowerCase();
    var out = pubs.filter(function(p){
      if(state.sources.size && !state.sources.has(p.source)) return false;
      if(state.themes.size && !p.themes.some(function(t){return state.themes.has(t);})) return false;
      if(q){ var hay=((p.titleEs||p.title||"")+" "+(p.summaryEs||p.summary||"")+" "+(p.title||"")).toLowerCase(); if(hay.indexOf(q)===-1) return false; }
      return true;
    });
    out.sort(function(a,b){
      var da=a.date||"", db=b.date||"";
      if(da===db) return 0;
      if(!da) return 1; if(!db) return -1;
      return state.sortDesc ? (da<db?1:-1) : (da<db?-1:1);
    });
    return out;
  }

  function render(){
    var items = filtered();
    document.getElementById("count").textContent = items.length + (items.length===1?" resultado":" resultados");
    var list = document.getElementById("list");
    if(!items.length){ list.innerHTML='<div class="empty">Sin resultados con los filtros actuales.</div>'; return; }
    list.innerHTML = items.map(function(p){
      var badge='<span class="badge" style="background:'+(SOURCE_COLOR[p.source]||"#666")+'">'+esc(SOURCE_LABEL[p.source]||p.source)+'</span>';
      var tags=(p.themes||[]).map(function(t){ return '<span class="tag">'+esc(THEME_LABEL[t]||t)+'</span>'; }).join("");
      var title = p.titleEs || p.title;
      var orig = (p.titleEs && p.title && p.titleEs !== p.title) ? '<div class="orig">'+esc(p.title)+'</div>' : '';
      var summaryText = p.summaryEs || p.summary;
      var summary = summaryText ? '<p>'+esc(summaryText)+'</p>' : '';
      return '<div class="card"><div class="head">'+badge+'<span class="date">'+fmtDate(p.date)+'</span></div>'+
        '<h3><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(title)+'</a></h3>'+
        orig+summary+'<div class="themes">'+tags+'</div></div>';
    }).join("");
  }

  document.getElementById("search").addEventListener("input", function(e){ state.q=e.target.value; render(); });
  document.getElementById("sortBtn").addEventListener("click", function(e){
    state.sortDesc=!state.sortDesc;
    e.target.textContent = "Ordenar: " + (state.sortDesc? "más recientes primero":"más antiguos primero");
    render();
  });

  // Canal de sugerencias. Deliberadamente NO usa un enlace mailto:, que depende
  // de que cada computador tenga configurado un cliente de correo — si no lo
  // tiene, el clic no hace nada y la persona queda sin saber por que. En vez de
  // eso mostramos el texto listo para copiar, con un atajo a Gmail.
  // Para cambiar el destinatario, edita las dos partes de CONTACTO.
  // Va partido a proposito: esta pagina es publica y los rastreadores de spam
  // recogen direcciones escritas completas en el HTML.
  var CONTACTO = ["contacto", "eticolabora.com"].join("@");
  var ASUNTO = "Radar - sugerencia de cambio";

  function textoSugerencia() {
    var ctx = [];
    if (state.q) ctx.push('Busqueda: "' + state.q + '"');
    if (state.sources.size) {
      ctx.push("Organismos: " + Array.from(state.sources).map(function (s) {
        return SOURCE_LABEL[s] || s; }).join(", "));
    }
    if (state.themes.size) {
      ctx.push("Temas: " + Array.from(state.themes).map(function (t) {
        return THEME_LABEL[t] || t; }).join(", "));
    }
    return "Hola,\n\nQuisiera sugerir un cambio en el Radar:\n\n" +
      "[ Escribe aqui que categoria, palabra clave u organismo falta o sobra ]\n\n" +
      "----------------------------------------\n" +
      "Contexto de lo que estaba viendo:\n" +
      (ctx.length ? ctx.join("\n") : "Sin filtros aplicados") + "\n" +
      "Publicaciones a la vista: " + filtered().length + "\n" +
      "Fecha: " + new Date().toLocaleString("es-CL") + "\n";
  }

  document.getElementById("suggestBtn").addEventListener("click", function () {
    var bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML =
      '<div class="modal">' +
        "<h2>Sugerir un cambio</h2>" +
        '<p class="hint">Escribe tu sugerencia abajo y envíala a <strong>' + esc(CONTACTO) +
        "</strong>. Puedes copiar el texto o abrirlo directamente en Gmail.</p>" +
        '<textarea id="sugTexto"></textarea>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-primary" id="sugCopiar">Copiar texto</button>' +
          '<button class="btn" id="sugGmail">Abrir en Gmail</button>' +
          '<button class="btn" id="sugCerrar">Cerrar</button>' +
          '<span class="ok-msg" id="sugOk" hidden>¡Copiado!</span>' +
        "</div>" +
      "</div>";
    document.body.appendChild(bg);

    var ta = bg.querySelector("#sugTexto");
    ta.value = textoSugerencia();
    ta.focus();

    function cerrar() { if (bg.parentNode) document.body.removeChild(bg); }
    bg.addEventListener("click", function (e) { if (e.target === bg) cerrar(); });
    bg.querySelector("#sugCerrar").addEventListener("click", cerrar);

    bg.querySelector("#sugCopiar").addEventListener("click", function () {
      var ok = bg.querySelector("#sugOk");
      function exito() { ok.hidden = false; setTimeout(function () { ok.hidden = true; }, 2500); }
      // El API moderno necesita contexto seguro; execCommand cubre el resto.
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(exito, function () { ta.select(); document.execCommand("copy"); exito(); });
      } else {
        ta.select(); document.execCommand("copy"); exito();
      }
    });

    bg.querySelector("#sugGmail").addEventListener("click", function () {
      window.open("https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(CONTACTO) +
        "&su=" + encodeURIComponent(ASUNTO) + "&body=" + encodeURIComponent(ta.value), "_blank");
    });
  });

  var upd = DATA.generatedAt ? new Date(DATA.generatedAt) : null;
  document.getElementById("updated").innerHTML = upd
    ? "Actualizado<br>"+upd.toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"short"})
    : "";
  document.getElementById("footer").textContent = "Radar interno Eticolabora · " + pubs.length + " publicaciones monitoreadas de " + Object.keys(SOURCE_LABEL).length + " organismos";

  renderStats(); renderFilters(); render();
})();
</script>
</body>
</html>
